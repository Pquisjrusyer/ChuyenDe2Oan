<html lang="vi">
<head>
  <meta charset="UTF-8" />

  <!-- Styles -->
  <link rel="stylesheet" href="./css/reset.css" />
  <link rel="stylesheet" href="./css/variables.css" />
  <link rel="stylesheet" href="./css/global.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/pages.css" />
  <link rel="stylesheet" href="./css/info-page.css" />
  <link rel="stylesheet" href="./css/info-feature-story.css" />
  <link rel="stylesheet" href="./css/character-section.css" />
  <link rel="stylesheet" href="./css/community-page.css" />
  <link rel="stylesheet" href="./css/faq-page.css" />

</head>
<body>
  <div id="app">
    <nav id="navbar-root"></nav>
    <div id="breadcrumb-root"></div>
    <main id="page-root"></main>
    <footer id="footer-root"></footer>
  </div>

  <!-- Modal Overlay -->
  <div id="modal-root"></div>

  <!-- Global Horror Melting SVG Filters -->
  <svg style="position: absolute; width: 0; height: 0; pointer-events: none;" aria-hidden="true">
    <defs>
      <filter id="horror-melt-filter" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.04 0.08" numOctaves="3" result="noise" seed="7">
          <animate attributeName="baseFrequency" dur="2.2s" values="0.03 0.07; 0.05 0.11; 0.03 0.07" repeatCount="indefinite"/>
        </feTurbulence>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="14" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <filter id="horror-melt-heavy" x="-30%" y="-30%" width="160%" height="160%">
        <feTurbulence type="turbulence" baseFrequency="0.02 0.06" numOctaves="3" result="noise" seed="15">
          <animate attributeName="baseFrequency" dur="1.8s" values="0.02 0.05; 0.04 0.09; 0.02 0.05" repeatCount="indefinite"/>
        </feTurbulence>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="24" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
  </svg>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
